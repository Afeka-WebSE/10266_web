<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Component</title>
  <link rel="stylesheet" href="/css/hw.css">
</head>
<body>

<main>
  <!-- Product card wrapped in an article tag -->
  <article class="product-card">
    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Wireless Headphones" class="product-img">

    <!-- Wrapper for text and button alignment -->
    <div class="product-content">
      <h2>Wireless Headphones</h2>
      <p>Experience high-quality sound with noise-canceling technology and up to 40 hours of battery life.</p>
      <span id="stock-display">Items left in stock: 4</span>
      <button id="add-to-cart-btn" class="btn-primary">Add to Cart (0)</button>
    </div>
  </article>
</main>

<script src="/js/hw.js"></script>
</body>
</html>
